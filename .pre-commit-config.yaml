minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: branch-policy
        name: Git Flow branch policy
        entry: uv run --locked python scripts/git_policy.py branch
        language: system
        pass_filenames: false
        always_run: true
      - id: conventional-commit
        name: Conventional Commit message
        entry: uv run --locked python scripts/git_policy.py commit
        language: system
        stages: [commit-msg]
      - id: merge-conflicts
        name: Merge conflict markers
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]
      - id: private-keys
        name: Private key detection
        entry: uv run --locked detect-private-key
        language: system
        types: [text]
      - id: large-files
        name: Added file size limit (500 KiB)
        entry: uv run --locked check-added-large-files --maxkb=500
        language: system
      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer
        language: system
        types: [text]
      - id: final-newline
        name: Final newline
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]
      - id: toml
        name: TOML syntax
        entry: uv run --locked check-toml
        language: system
        types: [toml]
      - id: ruff
        name: Ruff lint (auto-fix)
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: yaml
        name: YAML lint
        entry: uv run --locked yamllint --strict
        language: system
        types: [yaml]
      - id: actionlint
        name: GitHub Actions lint
        entry: uv run --locked actionlint -shellcheck= -pyflakes=
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
