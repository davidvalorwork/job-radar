[project]
name = "job-radar"
version = "0.1.0"
description = "Local-first job discovery with hexagonal boundaries and auditable offline workflows."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Job Radar contributors"}]
dependencies = [
  "pydantic>=2.13.5,<3",
  "pyyaml>=6.0.3,<7",
  "structlog>=26.1.0,<27",
  "psutil>=7.2.2,<8",
  "prometheus-client>=0.26.0,<0.27",
]

[project.urls]
Repository = "https://github.com/davidvalorwork/job-radar"
Issues = "https://github.com/davidvalorwork/job-radar/issues"

[project.optional-dependencies]
gmail = [
  "google-api-python-client>=2.180,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
radar = "job_radar.bootstrap:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "mypy>=1.18,<2",
  "types-PyYAML>=6.0,<7",
  "types-psutil>=7,<8",
  "pre-commit>=4.6.2,<5",
  "pre-commit-hooks>=6,<7",
  "yamllint>=1.38,<2",
  "actionlint-py==1.7.12.24",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "scripts"]

[tool.coverage.run]
source = ["job_radar"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
